spring.application.name=price-parser
spring.datasource.url=jdbc:h2:file:./data/prices;AUTO_SERVER=TRUE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

app.pool.core-size=4
app.pool.max-size=8
app.pool.queue-capacity=100
app.fetch.timeout=PT15S
app.fetch.host-parallelism=2
app.fetch.delay-ms=300
app.refresh.enabled=true
app.refresh.initial-delay=PT5M
app.refresh.interval=PT10M
app.seed.enabled=true
app.seed.urls=https://www.labirint.ru/books/1028597/,https://books.toscrape.com/catalogue/a-light-in-the-attic_1000/index.html,https://dummyjson.com/products/1
